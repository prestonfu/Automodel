# torchrun --nproc-per-node=8 examples/llm_pretrain/pretrain.py --config examples/llm_pretrain/nemotron_nano_v3_fineweb_small.yaml
# Scaled-down Nemotron: ~4.9B total / 1.2B active

benchmark:
  warmup_steps: 5
  peak_tflops: 989  # H100: 989, A100: 312
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
    trust_remote_code: true
    router_aux_loss_coef: 0.0001  # pp
    # Scaled-down architecture (~6B total / 1.2B active)
    hidden_size: 1792
    num_hidden_layers: 32
    hybrid_override_pattern: "MEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEME"
    num_attention_heads: 14
    intermediate_size: 1280
    moe_intermediate_size: 1280
    moe_shared_expert_intermediate_size: 2560
    n_routed_experts: 64
    num_experts_per_tok: 4
    mamba_num_heads: 32
  trust_remote_code: true

dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: /mnt/pretrain_data/fineweb_edu/processed_data_*_text_document*
  index_mapping_dir: /mnt/pretrain_data/fineweb_edu/mapping_dir
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  seq_length: 1024
  split: "0.99, 0.01, 0.00"
  splits_to_build: "train"

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: /mnt/pretrain_data/fineweb_edu/processed_data_*_text_document*
  index_mapping_dir: /mnt/pretrain_data/fineweb_edu/mapping_dir
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  seq_length: 1024
  split: "0.99, 0.01, 0.00"
  splits_to_build: "validation"
  num_val_samples: 1024

step_scheduler:
  global_batch_size: 128
  local_batch_size: 8
  ckpt_every_steps: 6000
  val_every_steps: 250
  num_epochs: 1
  max_steps: 9500

log_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 1

# autopipeline:
#   _target_: nemo_automodel.components.distributed.pipelining.autopipeline.AutoPipeline
#   pp_schedule: 1f1b
#   pp_microbatch_size: 2
#   scale_grads_in_schedule: false

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

parallelizer:
  _target_: nemo_automodel.components.moe.parallelizer.parallelize_model
  activation_checkpointing: false
  router_aux_loss_coef: 0.0001  # ep

checkpoint:
  enabled: true
  checkpoint_dir: /mnt/checkpoints/
  model_save_format: safetensors
  save_consolidated: true
  load_base_model: false

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  ep_size: 8
  pp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1

lr_scheduler:
  init_lr: 0.0
  max_lr: 1.0e-3
  min_lr: 1.0e-5
  lr_warmup_steps: 630
  lr_decay_steps: 9500
  lr_decay_style: WSD
  wsd_decay_steps: 1900
  lr_wsd_decay_style: cosine

wandb:
  wandb_online: true
  project: nemotron_nano_v3_pretrain
  entity: prestonfu
  name: fineweb_small
